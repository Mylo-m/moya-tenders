<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F0D"/>
      <stop offset="1" stop-color="#0F1512"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="46" fill="#E8F0EC" font-size="26" font-weight="700" text-anchor="middle">MY-LO · Moya — Agentic Tender Desk · Architecture</text>
  <text x="600" y="72" fill="#7FB39B" font-size="14" text-anchor="middle">All Things Agentic Hackathon · Gemini API + Google Cloud</text>

  <!-- Data sources -->
  <text x="150" y="120" fill="#9FB8AC" font-size="13" font-weight="600">TENDER PORTALS (11 markets)</text>
  <g font-size="12" fill="#CFE3D8" text-anchor="middle">
    <rect x="40"  y="132" width="92" height="30" rx="6" fill="#15201B" stroke="#2E6B4F"/>
    <text x="86"  y="152">ZA · KE · NG</text>
    <rect x="148" y="132" width="92" height="30" rx="6" fill="#15201B" stroke="#2E6B4F"/>
    <text x="194" y="152">ZM · TZ · GH</text>
    <rect x="256" y="132" width="92" height="30" rx="6" fill="#15201B" stroke="#2E6B4F"/>
    <text x="302" y="152">ZW · MA · RW</text>
    <rect x="364" y="132" width="120" height="30" rx="6" fill="#15201B" stroke="#2E6B4F"/>
    <text x="424" y="152">MU · ET · (MZ·NA·BW*)</text>
  </g>
  <text x="424" y="180" fill="#5E7A6C" font-size="11" text-anchor="middle">* MZ/NA/BW = OCDS best-effort (pub ids pending)</text>

  <!-- Scraper -->
  <rect x="150" y="220" width="280" height="64" rx="10" fill="#13241C" stroke="#34A853" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="248" fill="#E8F0EC" font-size="15" font-weight="700" text-anchor="middle">scraper_sqlite.py</text>
  <text x="290" y="270" fill="#9FB8AC" font-size="12" text-anchor="middle">6h cron · OCDS + portals → normalize</text>

  <!-- DB -->
  <rect x="150" y="340" width="280" height="64" rx="10" fill="#13241C" stroke="#34A853" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="368" fill="#E8F0EC" font-size="15" font-weight="700" text-anchor="middle">moya.db (SQLite)</text>
  <text x="290" y="390" fill="#9FB8AC" font-size="12" text-anchor="middle">9,300+ tenders · idempotent upserts</text>

  <!-- API on Cloud Run -->
  <rect x="150" y="470" width="280" height="74" rx="10" fill="#1A2A20" stroke="#FBBC04" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="498" fill="#E8F0EC" font-size="15" font-weight="700" text-anchor="middle">moya_api (FastAPI)</text>
  <text x="290" y="518" fill="#9FB8AC" font-size="12" text-anchor="middle">proposal-gen · counters · health</text>
  <text x="290" y="536" fill="#FBBC04" font-size="11" text-anchor="middle">▶ Google Cloud Run</text>

  <!-- Gemini -->
  <rect x="760" y="455" width="300" height="104" rx="12" fill="#0E1B33" stroke="url(#gem)" stroke-width="2" filter="url(#sh)"/>
  <text x="910" y="492" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Gemini API</text>
  <text x="910" y="516" fill="#C9D6F0" font-size="12" text-anchor="middle">PDF shred → obligations</text>
  <text x="910" y="534" fill="#C9D6F0" font-size="12" text-anchor="middle">compliance check · bid draft</text>

  <!-- Outputs -->
  <rect x="150" y="620" width="180" height="58" rx="10" fill="#13241C" stroke="#34A853" stroke-width="1.5" filter="url(#sh)"/>
  <text x="240" y="646" fill="#E8F0EC" font-size="14" font-weight="700" text-anchor="middle">dashboard.php</text>
  <text x="240" y="666" fill="#9FB8AC" font-size="11" text-anchor="middle">command center</text>

  <rect x="350" y="620" width="180" height="58" rx="10" fill="#13241C" stroke="#34A853" stroke-width="1.5" filter="url(#sh)"/>
  <text x="440" y="646" fill="#E8F0EC" font-size="14" font-weight="700" text-anchor="middle">moya_ai.php</text>
  <text x="440" y="666" fill="#9FB8AC" font-size="11" text-anchor="middle">Gemini shredder UI</text>

  <rect x="550" y="620" width="180" height="58" rx="10" fill="#13241C" stroke="#34A853" stroke-width="1.5" filter="url(#sh)"/>
  <text x="640" y="646" fill="#E8F0EC" font-size="14" font-weight="700" text-anchor="middle">WhatsApp alerts</text>
  <text x="640" y="666" fill="#9FB8AC" font-size="11" text-anchor="middle">field digest</text>

  <!-- GCP footer -->
  <rect x="760" y="620" width="300" height="58" rx="10" fill="#1A2A20" stroke="#FBBC04" stroke-width="1.5" filter="url(#sh)"/>
  <text x="910" y="646" fill="#E8F0EC" font-size="13" font-weight="700" text-anchor="middle">Google Cloud</text>
  <text x="910" y="666" fill="#FBBC04" font-size="11" text-anchor="middle">Cloud Run + Cloud Storage sync</text>

  <!-- Arrows -->
  <g stroke="#5E7A6C" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#5E7A6C"/>
      </marker>
    </defs>
    <path d="M290,162 C290,180 290,188 290,218"/>
    <path d="M290,284 C290,300 290,308 290,338"/>
    <path d="M290,404 C290,420 290,428 290,468"/>
    <path d="M430,507 C620,507 700,507 755,507"/>
    <path d="M290,544 C290,580 290,600 290,618"/>
    <path d="M430,649 C440,649 440,649 548,649"/>
    <path d="M630,649 C700,649 740,649 758,649"/>
    <path d="M640,678 C760,690 820,650 858,645"/>
  </g>

  <text x="600" y="780" fill="#5E7A6C" font-size="11" text-anchor="middle">State: SQLite (source of truth) · Credentials: env-only (never in repo) · Failure: per-source try/except + scrape_log audit</text>
</svg>
